<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桌面空气监测器</title>
  <style>
    :root { color-scheme: dark; --bg: #101318; --panel: #191e26; --line: #303946; --text: #f3f6fa; --muted: #9da8b7; --good: #20bd69; --warn: #e7a52c; --bad: #ed554d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100% - 32px, 980px); margin: 0 auto; padding: 28px 0 40px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); letter-spacing: 0; }
    header p { color: var(--muted); margin: 5px 0 0; }
    #connection { color: var(--muted); text-align: right; font-size: .86rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 18px; min-height: 124px; }
    .label { color: var(--muted); font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; }
    .value { margin-top: 14px; font-size: clamp(1.7rem, 5vw, 2.6rem); font-weight: 650; }
    .unit { color: var(--muted); font-size: .85rem; font-weight: 400; }
    .aqi-good { color: var(--good); } .aqi-moderate { color: var(--warn); } .aqi-poor { color: var(--bad); }
    section { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 18px; }
    section h2 { font-size: 1rem; margin: 0 0 14px; }
    canvas { display: block; width: 100%; height: 230px; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px 20px; color: var(--muted); font-size: .86rem; }
    .status { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); } .dot.ok { background: var(--good); }
    footer { color: var(--muted); font-size: .78rem; margin-top: 18px; }
    @media (max-width: 650px) { header { align-items: start; flex-direction: column; } #connection { text-align: left; } .grid { grid-template-columns: repeat(2, 1fr); } .card:last-child { grid-column: 1 / -1; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>桌面空气监测器</h1><p>局域网传感器仪表盘</p></div><div id="connection">正在连接...</div></header>
  <div class="grid">
    <article class="card"><div class="label">温度</div><div class="value" id="temperature">-- <span class="unit">°C</span></div></article>
    <article class="card"><div class="label">湿度</div><div class="value" id="humidity">-- <span class="unit">%</span></div></article>
    <article class="card"><div class="label">空气质量</div><div class="value" id="aqi">-- <span class="unit">AQI</span></div></article>
    <article class="card"><div class="label">TVOC</div><div class="value" id="tvoc">-- <span class="unit">ppb</span></div></article>
    <article class="card"><div class="label">eCO₂ 估算值</div><div class="value" id="eco2">-- <span class="unit">ppm</span></div></article>
    <article class="card"><div class="label">传感器状态</div><div class="value" id="sensor-status" style="font-size:1.1rem">--</div></article>
  </div>
  <section><h2>24 小时趋势</h2><canvas id="chart" width="900" height="230"></canvas><div class="meta"><span>温度和湿度使用左侧刻度。</span><span>AQI 使用右侧刻度。</span></div></section>
  <footer>ENS160 eCO₂ 是等效 CO₂ 估算值，并非 NDIR CO₂ 实测值。历史数据仅保存在设备内存中，重启后清空。</footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (v, digits = 1) => Number.isFinite(Number(v)) ? Number(v).toFixed(digits) : '--';
  function setText(id, text) { $(id).firstChild.nodeValue = text + ' '; }
  function paintStatus(status) {
    const air = status.sensors?.ens160 || 'unknown';
    const climate = status.sensors?.sht30 || 'unknown';
    $('sensor-status').textContent = `SHT30 ${climate} · ENS160 ${air}`;
  }
  function paintReadings(data) {
    const r = data.readings || {};
    setText('temperature', fmt(r.temperatureC)); setText('humidity', fmt(r.humidityPercent));
    setText('aqi', r.aqi ?? '--'); setText('tvoc', r.tvocPpb ?? '--'); setText('eco2', r.eco2Ppm ?? '--');
    const aqi = Number(r.aqi); $('aqi').className = `value ${aqi <= 2 ? 'aqi-good' : aqi === 3 ? 'aqi-moderate' : aqi >= 4 ? 'aqi-poor' : ''}`;
    $('connection').innerHTML = `<span class="status"><span class="dot ${data.wifi?.connected ? 'ok' : ''}"></span>${data.wifi?.connected ? `Wi-Fi 已连接 · ${data.wifi.ip}` : 'Wi-Fi 未连接'}</span>`;
    paintStatus(data);
  }
  function drawChart(points) {
    const canvas = $('chart'), ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h); ctx.strokeStyle = '#303946'; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) { const y = 18 + i * (h - 42) / 4; ctx.beginPath(); ctx.moveTo(42, y); ctx.lineTo(w - 12, y); ctx.stroke(); }
    if (!points.length) { ctx.fillStyle = '#9da8b7'; ctx.fillText('正在采集历史数据，首个数据点将在 5 分钟后生成...', 55, h / 2); return; }
    const x = (i) => 48 + i * (w - 68) / Math.max(points.length - 1, 1);
    const yClimate = (v) => h - 22 - Number(v) * (h - 42) / 100;
    const yAqi = (v) => h - 22 - Number(v) * (h - 42) / 5;
    function line(key, color, y) { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); points.forEach((p, i) => { const px = x(i), py = y(p[key]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke(); }
    line('temperatureC', '#42b7ff', yClimate); line('humidityPercent', '#b893ff', yClimate); line('aqi', '#f0a84b', yAqi);
    ctx.fillStyle = '#9da8b7'; ctx.font = '12px system-ui'; ctx.fillText('温度/湿度', 48, 14); ctx.fillText('AQI', w - 36, 14);
  }
  async function refresh() { try { const [s, h] = await Promise.all([fetch('/api/status'), fetch('/api/history')]); const status = await s.json(); const history = await h.json(); paintReadings(status); drawChart(history.points || []); } catch (e) { $('connection').textContent = '仪表盘离线'; } }
  refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
